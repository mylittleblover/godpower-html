<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">上帝的力量 · 应用图标</title>
  <desc id="desc">深蓝色圆角方形背景、金色圣光光环、红色五角星和一张以马克思蓬松头发与大胡子为灵感绘制的极简肖像。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A35"/>
      <stop offset=".55" stop-color="#20234A"/>
      <stop offset="1" stop-color="#31234C"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="41%" r="49%">
      <stop offset="0" stop-color="#F4C66A" stop-opacity=".20"/>
      <stop offset=".66" stop-color="#F4C66A" stop-opacity=".055"/>
      <stop offset="1" stop-color="#F4C66A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#FFF0AD"/>
      <stop offset=".53" stop-color="#F9C65F"/>
      <stop offset="1" stop-color="#D9973A"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5E8"/>
      <stop offset=".53" stop-color="#E5E4E8"/>
      <stop offset="1" stop-color="#B7BFD4"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FDF4E7"/>
      <stop offset=".63" stop-color="#E4E5EE"/>
      <stop offset="1" stop-color="#BCC8D9"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#F8D9BD"/>
      <stop offset="1" stop-color="#D4A88F"/>
    </linearGradient>
    <clipPath id="tile"><rect x="12" y="12" width="488" height="488" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="12" y="12" width="488" height="488" fill="url(#bg)"/>
    <circle cx="256" cy="208" r="229" fill="url(#aura)"/>

    <!-- Saintly radiance: abstract reference to God -->
    <circle cx="256" cy="220" r="154" fill="none" stroke="url(#ring)" stroke-width="19"/>
    <circle cx="256" cy="220" r="137" fill="none" stroke="#FFE5A0" stroke-opacity=".24" stroke-width="2"/>
    <g fill="#FFD47A">
      <path d="M256 29l8 16-8 15-8-15z"/>
      <path d="M99 84l17 5 3 17-17-5z" transform="rotate(-9 108 94)"/>
      <path d="M413 84l-17 5-3 17 17-5z" transform="rotate(9 404 94)"/>
      <path d="M55 210l15 8-15 8-15-8z"/>
      <path d="M457 210l15 8-15 8-15-8z"/>
    </g>

    <!-- Lightning: the power in the title -->
    <path d="M107 305 86 343h20l-8 36 40-51h-23l11-23z" fill="#FFD47A"/>

    <!-- Bust and garment -->
    <path d="M75 510c12-67 57-97 111-113 29-9 57-12 70-12s41 3 70 12c54 16 99 46 111 113Z" fill="#10162E"/>
    <path d="M156 417c31-14 63-21 100-21 38 0 70 7 101 21l29 93H126z" fill="#2C305A"/>
    <path d="M188 405l68 61 68-61-25-14h-86z" fill="#17203B"/>
    <path d="M188 404l68 60-31 46h-75zM324 404l-68 60 31 46h75z" fill="#3F416B"/>

    <!-- The unmistakable broad, frizzy Marx hair silhouette -->
    <path d="M153 294c-25-7-38-28-33-54-20-12-20-44-2-59-7-24 9-48 32-52 10-26 36-39 59-29 22-21 54-19 73-9 27-12 59 2 69 27 28 3 45 29 40 56 19 17 18 49-4 65 3 25-14 48-39 55l-14-38-169 1z" fill="#A6ADBE"/>
    <path d="M148 282c-25-13-24-33-17-48-18-22-5-43 12-51-4-25 16-43 38-40 7-30 37-36 56-24 22-19 57-20 81-4 25-6 48 14 47 39 26 6 35 33 18 51 12 25-3 51-28 59l-15-30-178 5z" fill="url(#hair)"/>
    <!-- Hair waves / tufts -->
    <g fill="none" stroke="#9BA6BB" stroke-linecap="round" opacity=".65">
      <path d="M146 222c-11-17-3-33 13-37M155 186c2-22 24-32 40-26M184 148c14-21 37-19 47-11M250 132c24-12 50-5 58 12M332 141c21 6 27 24 20 39M364 188c14 13 13 28 1 41" stroke-width="6"/>
      <path d="M151 260c-14-14-13-26-2-40M348 264c14-14 16-28 9-41" stroke-width="5"/>
    </g>

    <!-- Face -->
    <path d="M177 204c13-26 42-43 77-43 37 0 68 15 83 43l6 77c-3 37-31 67-58 83h-61c-29-17-54-47-58-83z" fill="url(#skin)"/>
    <path d="M176 255c-10-13-22-7-21 10 2 17 10 28 24 30zM339 254c12-12 23-6 20 12-3 18-12 26-24 29z" fill="#D4A78B"/>
    <!-- Heavy recognizable brow and thoughtful eyes -->
    <path d="M193 243c14-10 31-11 45-4M277 238c15-7 32-6 46 4" fill="none" stroke="#566078" stroke-width="10" stroke-linecap="round"/>
    <path d="M199 259c12-6 23-6 33 0M280 259c12-6 24-6 34 1" fill="none" stroke="#273149" stroke-width="6" stroke-linecap="round"/>
    <path d="M253 252l-9 35c7 7 17 7 25 1" fill="none" stroke="#B77F72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Huge flowing moustache / beard are signature Marx silhouette -->
    <path d="M194 281c-27 11-33 33-27 60-15 22-8 43 10 57-1 28 19 42 42 40 12 20 28 31 37 37 12-9 27-19 38-37 27 1 44-16 43-42 21-14 24-39 11-57 4-31-9-52-32-59l-32 15-29 4-28-5z" fill="url(#beard)"/>
    <!-- Coarse beard silhouette points and motion -->
    <path d="M179 352c-18 25-11 42 11 54l-6-27M334 348c19 23 12 43-9 56l3-28" fill="#D2D8E6"/>
    <path d="M204 319c-6 22 9 39 16 46 0 21 10 42 18 54M306 319c7 22-9 39-16 46 0 23-10 44-19 56" fill="none" stroke="#B9C3D4" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M232 373c-7 28 4 57 24 80 19-24 32-50 25-79" fill="none" stroke="#CBD1DF" stroke-width="8" stroke-linecap="round"/>
    <!-- White moustache wings -->
    <path d="M251 303c-14-10-22-16-40-15-17-1-29 12-36 24 16-8 27-1 37 6 20 12 36 4 44-7z" fill="#FFF9F0"/>
    <path d="M261 303c14-10 22-16 40-15 17-1 29 12 36 24-16-8-27-1-37 6-20 12-36 4-44-7z" fill="#E3E6ED"/>
    <path d="M240 334c10 5 21 5 31 0" fill="none" stroke="#B7ACAE" stroke-opacity=".65" stroke-width="4" stroke-linecap="round"/>

    <!-- Red five-point star anchors the Marxist reference -->
    <circle cx="256" cy="89" r="36" fill="#1D2444" stroke="#F9C969" stroke-width="5"/>
    <path d="M256 65l7.1 15 16.5 2.1-12.1 11.4 3.1 16.4-14.6-8-14.6 8 3.1-16.4-12.1-11.4 16.5-2.1z" fill="#F06464"/>
  </g>
  <rect x="13" y="13" width="486" height="486" rx="111" fill="none" stroke="#FFF7DF" stroke-opacity=".13" stroke-width="2"/>
</svg>