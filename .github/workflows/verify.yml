name: Manual HTML verification
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # source-at-commit differential and 14-group baselines
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve Chromium
        run: node -e "console.log('CHROMIUM_PATH='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-and-test-evidence
          path: |
            dist/
            artifacts/
